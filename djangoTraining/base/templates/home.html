{% extends 'main.html' %}

{% block content %}
    <h1>Welcome to Django Training</h1>
    <p>This is the home page of the Django Training project.</p>

    <div>
        {% for room in rooms %}
            <div>
                <a href="{% url 'room' room.id %}">{{ room.name }}</a>
                <p>{{ room.status}}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
